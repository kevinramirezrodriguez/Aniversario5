  .velo { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(60,30,70,.55); backdrop-filter: blur(3px); z-index: 20; padding: 16px; box-sizing: border-box; }

  .cerrar { position: absolute; top: 8px; right: 10px; width: 36px; height: 36px; border: 0; border-radius: 50%; background: #f7c6d3; color: #8c2247; font-size: 22px; line-height: 1; cursor: pointer; }
  #lista { list-style: none; margin: 0 0 10px; padding: 0; }

  #lista .caja { flex: 0 0 24px; height: 24px; border: 2px solid #d9628a; border-radius: 7px; display: grid; place-items: center; color: #fff; font-size: 15px; background: #fff; transition: background .2s; }

  .btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #a82a58; }
  #escenario svg.cap { position: absolute; left: 0; top: 0; pointer-events: none; transform: translateZ(0); }
  .blend { mix-blend-mode: soft-light; }
  #fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
  .agregar { display: flex; gap: 8px; margin: 4px 0 12px; }

  #lista .del { margin-left: auto; flex: 0 0 auto; border: 0; background: transparent; color: #c2365f; font-size: 18px; cursor: pointer; padding: 0 4px; }
  #btn-salir { position: fixed; top: max(10px, env(safe-area-inset-top)); left: 10px; z-index: 6; display: flex; align-items: center; gap: 6px; padding: 8px 14px 8px 10px; border: 0; border-radius: 999px; background: linear-gradient(#ff7aa5,#e0457b); color: #fff; font: 700 15px Georgia, serif; box-shadow: 0 3px 0 #a82a58, 0 6px 14px rgba(0,0,0,.2); cursor: pointer; }

  .m-nube { position: absolute; z-index: 0; width: 130px; height: 40px; border-radius: 40px; background: #fff; opacity: .75; filter: blur(1px); animation: deriva2 16s ease-in-out infinite alternate; }

  .m-nube::after { width: 46px; height: 46px; left: 66px; top: -20px; }

  @keyframes deriva2 { from { margin-left: -14px; } to { margin-left: 14px; } }
  .m-cor { position: absolute; z-index: 2; bottom: 20dvh; font-style: normal; color: #ff5c8d; opacity: 0; animation: sube 7s ease-in infinite; }

let TS = 1; // factor de velocidad (acelera cada gesto para que dure <= 3 s)

const rnd = (a, b) => a + Math.random() * (b - a);
const E = { io: t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2, out: t => 1 - Math.pow(1 - t, 3), lin: t => t, back: t => 1 + 2.7 * Math.pow(t - 1, 3) + 1.7 * Math.pow(t - 1, 2) };
const HEART = 'M0,.95 C-1.4,-.05 -1.15,-1 -.5,-1 C-.2,-1 0,-.75 0,-.55 C0,-.75 .2,-1 .5,-1 C1.15,-1 1.4,-.05 0,.95Z';
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function h(parent, markup) { const g = document.createElementNS(NS, 'g'); g.innerHTML = markup; const first = g.firstElementChild; parent.appendChild(first); return first; }

function tw(ms, fn, ease = E.io) {
  return new Promise(res => {
    const t0 = performance.now(); ms = ms / TS;
    (function f(n) { const t = clamp((n - t0) / ms, 0, 1); fn(ease(t), t); t < 1 ? requestAnimationFrame(f) : res(); })(t0);
  });
}
function to(obj, tgt, ms, ease = E.io) {
  const from = {}; for (const k in tgt) from[k] = obj[k];
  return tw(ms, t => { for (const k in tgt) obj[k] = from[k] + (tgt[k] - from[k]) * t; }, ease);
}

/* ---------- Rigs ---------- */
class Arm {
  constructor(rig, g, px, py, vx, vy) {
    this.rig = rig; this.g = g; this.px = px; this.py = py; this.vx = vx; this.vy = vy;
    this.a = 0; this.k = 1; this.th0 = Math.atan2(-vx, vy) * 180 / Math.PI; this.len = Math.hypot(vx, vy) * rig.sc;
  }
  get sx() { return this.rig.ox + this.rig.sc * this.px; }
  get sy() { return this.rig.oy + this.rig.sc * this.py; }
  solve(tx, ty) {
    const dx = tx - this.sx, dy = ty - this.sy, d = Math.hypot(dx, dy);
    let a = Math.atan2(-dx, dy) * 180 / Math.PI - this.th0;
    a += 360 * Math.round((this.a - a) / 360);

/* ---------- Texto con puntos (nubes / hojas) ---------- */
function sampleText(lines, step) {
  const c = document.createElement('canvas'); c.width = 600; c.height = 320; const x = c.getContext('2d');
  x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillStyle = '#000';
  lines.forEach(l => { x.font = `800 ${l.size}px "Trebuchet MS","Arial Rounded MT Bold",Arial,sans-serif`; x.fillText(l.t, 300, l.y); });
  const d = x.getImageData(0, 0, 600, 320).data, pts = [];
  for (let yy = 0; yy < 320; yy += step) for (let xx = 0; xx < 600; xx += step) {
    const px = xx + rnd(-1, 1), py = yy + rnd(-1, 1);
    if (d[((Math.round(clamp(py, 0, 319)) * 600) + Math.round(clamp(px, 0, 599))) * 4 + 3] > 120) pts.push([px, py]);
  }
  return pts;
}
const fx = $('#fx'), cx = fx.getContext('2d');
function fxSize() { const d = Math.min(window.devicePixelRatio || 1, 2); fx.width = innerWidth * d; fx.height = innerHeight * d; fx._d = d; }
addEventListener('resize', fxSize); fxSize();
function runFx(total, draw) {
  return new Promise(res => {
    const t0 = performance.now();
    (function f(n) {
      const T = Math.max(0, n - t0), m = esc.getScreenCTM(), d = fx._d;
      cx.setTransform(1, 0, 0, 1, 0, 0); cx.clearRect(0, 0, fx.width, fx.height);
      cx.setTransform(m.a * d, m.b * d, m.c * d, m.d * d, m.e * d, m.f * d);
      draw(cx, T);
      if (T < total) requestAnimationFrame(f); else { cx.setTransform(1, 0, 0, 1, 0, 0); cx.clearRect(0, 0, fx.width, fx.height); res(); }
    })(t0);
  });
}
function sprite(c0, c1, sh) {
  const c = document.createElement('canvas'); c.width = c.height = 64; const g = c.getContext('2d');
  if (sh) g.fillStyle = 'rgba(190,165,215,.55)'; else { const r = g.createRadialGradient(26, 24, 4, 32, 32, 30); r.addColorStop(0, '#fff'); r.addColorStop(.7, '#fff'); r.addColorStop(1, '#e9ddf5'); g.fillStyle = r; }
  g.beginPath(); g.arc(32, 32, 30, 0, 7); g.fill(); return c;
}
const puffS = sprite(), shadS = sprite(0, 0, 1);
function glow(c, a) { c.globalAlpha = a; c.fillStyle = '#fff'; c.beginPath(); c.roundRect ? c.roundRect(14, 6, 572, 150, 40) : c.rect(14, 6, 572, 150); c.fill(); c.globalAlpha = 1; }
async function textoNubes() {
  if (busy) return; setBusy(true); quiet = true;
  const izq = $('#nubes-izq'), der = $('#nubes-der'), st = { l: 0, r: 0 };
  const mv = () => { izq.setAttribute('transform', `translate(${-st.l} 0)`); der.setAttribute('transform', `translate(${st.r} 0)`); };
  const items = sampleText([{ t: TE_AMO, size: 78, y: 78 }], 5.5).map(([x, y]) => ({ x, y, r: rnd(4.4, 6.2), sx: x + rnd(-40, 40), sy: y + rnd(-30, 30), d: 500 + (x / 600) * 900 }));
  const fxp = runFx(7700, (c, T) => {
    const fade = T > 6600 ? clamp(1 - (T - 6600) / 1000, 0, 1) : 1;
    glow(c, .22 * fade * clamp(T / 800, 0, 1));
    c.globalAlpha = fade;
    for (const pass of [shadS, puffS]) for (const it of items) {
      const u = E.out(clamp((T - it.d) / 900, 0, 1)); if (u <= 0) continue;
      const x = it.sx + (it.x - it.sx) * u, y = it.y + (it.sy - it.y) * (1 - u) + (pass === shadS ? 2.6 : 0), z = it.r * 2.2 * u;
      c.drawImage(pass, x - z / 2, y - z / 2, z, z);
    }
    c.globalAlpha = 1;
  });
  await tw(1500, t => { st.l = 360 * t; st.r = 360 * t; mv(); });
  await wait(5000);
  await tw(1500, t => { st.l = 360 * (1 - t); st.r = 360 * (1 - t); mv(); });
  await fxp; quiet = false;
  await mExcited(2);
  setBusy(false);
}

function sceneCenter(elm) {
  const r = elm.getBoundingClientRect(), p = svgRoot.createSVGPoint(); p.x = r.left + r.width / 2; p.y = r.top + r.height / 2;
  const q = p.matrixTransform(esc.getScreenCTM().inverse()); return [q.x, q.y];
}
const LEAF = new Path2D('M-7,0 C-3,-6 3,-6 7,0 C3,6 -3,6 -7,0Z');
async function textoHojas() {
  if (busy) return; setBusy(true); quiet = true;
  const [cx0, cy0] = sceneCenter($('#hojas'));
  const G1 = ['#2f9a3e', '#4fb34a', '#79cf5d', '#e8a1b9'], G2 = ['#1f7a2e', '#2a8a38', '#2f9a3e'];
  const mk = (pts, ls, cols) => pts.map(([x, y], i) => ({ x, y, ls, col: cols[i % cols.length], sx: cx0 + rnd(-90, 90), sy: cy0 + rnd(-70, 70), r0: rnd(0, 360), r1: rnd(-50, 50), d: rnd(0, 700), fd: rnd(0, 400), fdur: rnd(1100, 1800), fx: rnd(-60, 60), fy: rnd(200, 420), fr: rnd(-300, 300) }));
  const items = mk(sampleText([{ t: ANIV[0], size: 62, y: 50 }], 5.2), 1, G1).concat(mk(sampleText([{ t: ANIV[1], size: 42, y: 114 }], 3.4), .36, G2));
  const FALL = 6700;

function pintaLista() {

    const li = document.createElement('li'); li.innerHTML = '<span class="caja">✓</span><span class="t"></span>'; li.querySelector('.t').textContent = t;
